name: Render

# What the renderer computes: full-frame goldens, the palette-to-framebuffer path
# at both line widths, the TMS9918A-only build, the runtime chip switch, and two
# instances proving no scanline state is shared between them.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  goldens:
    name: Golden frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh goldens

  pixels:
    name: Pixel path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh pixels

  gpu:
    name: GPU pacing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh gpu

  tms9918:
    name: TMS9918A mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh tms9918

  chip:
    name: Runtime chip switch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh chip

  multi:
    name: Multi-instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh multi
