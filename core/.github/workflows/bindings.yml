name: Bindings

# The CPython extension in bindings/python: that it builds against the
# installed library, drives the host bus, and neither leaks nor over-frees.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
      - run: tools/ci.sh python
