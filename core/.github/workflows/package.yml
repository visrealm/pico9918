name: Package

# That `cmake --install` and CPack produce a consumable archive on every
# toolchain, and that a tag turns those archives into a release.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, shell: bash }
          - { name: macos, os: macos-latest, shell: bash }
          - { name: windows-mingw, os: windows-latest, shell: 'msys2 {0}' }
          - { name: windows-msvc, os: windows-latest, shell: cmd }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
        with:
          toolchain: ${{ matrix.name }}
      - if: matrix.name != 'windows-msvc'
        run: tools/ci.sh package
      # cmd, so vcvars64 survives into the build. tools/msvc.cmd finds the
      # toolset with vswhere and hands off to bash - see the note in it for
      # why this is not -G "Visual Studio 17 2022".
      - if: matrix.name == 'windows-msvc'
        run: tools\msvc.cmd tools/ci.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: pico9918-core-${{ matrix.name }}
          path: |
            build-ci/lib/pico9918-core-*.tar.gz
            build-ci/lib/pico9918-core-*.zip

  release:
    name: Attach the archives to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
