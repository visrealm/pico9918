name: Package

# That `cmake --install` and CPack produce consumable static and shared archives
# on every toolchain, and that a tag turns those archives into a release.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, shell: bash }
          - { name: macos, os: macos-latest, shell: bash }
          - { name: windows-mingw, os: windows-latest, shell: 'msys2 {0}' }
          - { name: windows-msvc, os: windows-latest, shell: cmd }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/env
        with:
          toolchain: ${{ matrix.name }}
      - name: Read the stage from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^project(pico9918_core VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ ! $GITHUB_REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-((alpha|beta|rc)[0-9]+))?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-alphaN, -betaN or -rcN"; exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"; exit 1
          fi
          echo "PICO9918_PRERELEASE=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
      - if: matrix.name != 'windows-msvc'
        run: tools/ci.sh package
      # cmd, so vcvars64 survives into the build. tools/msvc.cmd finds the
      # toolset with vswhere and hands off to bash - see the note in it for
      # why this is not -G "Visual Studio 17 2022".
      - if: matrix.name == 'windows-msvc'
        run: tools\msvc.cmd tools/ci.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: pico9918-core-${{ matrix.name }}
          path: |
            build-ci/packages/pico9918-core-*.tar.gz
            build-ci/packages/pico9918-core-*.zip

  release:
    name: Attach the archives to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $PRERELEASE
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
