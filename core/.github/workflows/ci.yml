name: CI

# The commands live in tools/ci.sh, not here. This repository is published from
# the pico9918 firmware repository, which runs the same jobs from a workflow of
# its own, and two copies of the commands would drift.
#
# What this does NOT cover: the RP2040 / RP2350 build, which needs the Pico SDK
# and the firmware around it, and what a scanline costs on a device - the suite
# here asserts what the renderer computed, and the firmware repository measures
# what it cost. A green badge means the library is correct and portable, not that
# the firmware builds or that it fits in the line.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  goldens:
    name: Golden frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The overlay assets are generated at build time by tools/img2carray.py.
      # Without pillow the configure step still passes and the build fails later
      # on "No module named 'PIL'".
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pillow
      - run: tools/ci.sh goldens

  suite:
    name: Renderer suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, shell: bash }
          - { name: macos, os: macos-latest, shell: bash }
          - { name: windows-mingw, os: windows-latest, shell: 'msys2 {0}' }
          - { name: windows-msvc, os: windows-latest, shell: cmd }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python-pillow
      - if: matrix.name != 'windows-mingw'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: matrix.name != 'windows-mingw'
        run: python -m pip install --upgrade pillow
      - if: matrix.name != 'windows-msvc'
        run: tools/ci.sh suite
      # cmd, so vcvars64 survives into the build. tools/msvc.cmd finds the
      # toolset with vswhere and hands off to bash - see the note in it for
      # why this is not -G "Visual Studio 17 2022".
      - if: matrix.name == 'windows-msvc'
        run: tools\msvc.cmd tools/ci.sh suite

  warnings:
    name: Warnings (${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: macos-latest, cc: clang }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pillow
      - run: tools/ci.sh warnings

  multi:
    name: Multi-instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pillow
      - run: tools/ci.sh multi

  tms9918:
    name: TMS9918A mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pillow
      - run: tools/ci.sh tms9918

  python:
    name: Python module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # pillow because this job configures the library, which generates the overlays.
      - run: python -m pip install --upgrade pillow
      - run: tools/ci.sh python

  docs:
    name: Doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      # The Doxyfile is generated, so this job configures the library too.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pillow
      - run: tools/ci.sh doxygen
      # Generated, never committed. Uploaded on every run so a pull request can
      # be read as a site; only the default branch publishes it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/code

  pages:
    name: Publish the API documentation
    needs: docs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, shell: bash }
          - { name: macos, os: macos-latest, shell: bash }
          - { name: windows-mingw, os: windows-latest, shell: 'msys2 {0}' }
          - { name: windows-msvc, os: windows-latest, shell: cmd }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python-pillow
      - if: matrix.name != 'windows-mingw'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: matrix.name != 'windows-mingw'
        run: python -m pip install --upgrade pillow
      - if: matrix.name != 'windows-msvc'
        run: tools/ci.sh package
      # cmd, so vcvars64 survives into the build. tools/msvc.cmd finds the
      # toolset with vswhere and hands off to bash - see the note in it for
      # why this is not -G "Visual Studio 17 2022".
      - if: matrix.name == 'windows-msvc'
        run: tools\msvc.cmd tools/ci.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: pico9918-core-${{ matrix.name }}
          path: |
            build-ci/lib/pico9918-core-*.tar.gz
            build-ci/lib/pico9918-core-*.zip

  release:
    name: Attach the archives to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
