name: Build environment
description: The toolchain and Python one CI job needs.

# Referenced as ./.github/actions/env from the published library repository and
# as ./core/.github/actions/env from the firmware repository, which runs the
# same jobs against the same core/ subtree.

inputs:
  toolchain:
    description: linux, macos, windows-mingw or windows-msvc
    default: linux
  doxygen:
    description: also install doxygen
    default: 'false'

runs:
  using: composite
  steps:
    # MSYS2 brings its own Python. setup-python would install a second
    # interpreter the msys2 shell cannot see.
    - if: inputs.toolchain == 'windows-mingw'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-python

    - if: inputs.toolchain != 'windows-mingw'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # No pip install: configuring generates the overlay assets through
    # tools/img2carray.py, which decodes the PNGs with the standard library.

    - if: inputs.doxygen == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y doxygen
